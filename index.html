<!doctype html>
<html>
  <head>
    <title>Fashion UI</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="./cart-page/index.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">

  </head>
  <body>

  <section class="hero">
    <nav class="navbar scrolled">
      <div class="logo">KHR</div>
<div class="nav-right">
      <ul class="nav-links">
        <li><a href="#our-products">Collection</a></li>
        <li><a href="./about-page/index.html">About</a></li>
        <li><a href="#" id="open-search" onclick="openSearch(event)">Search</a></li>
      </ul>
      <div class="nav-bag">
        <button class="login" onclick="goto_login()">Login</button>
          <span ><a href="#" id="khr-open-cart" onclick="openCart(event)">👜</a></span>
        </div>
        </div>
      </div>

    </nav>
    <div class="hero-content">
      <div class="label-line"></div>
      <p class="sub">AUTUMN/WINTER 2026</p>

      <h1>
        The Art of <br>
        <span>Timeless</span><br>
        Elegance
      </h1>

      <div class="buttons">
        <a href="#Collection-page">
        <button class="btn primary">EXPLORE COLLECTION</button></a>
        <button class="btn outline">NEW ARRIVALS</button>
      </div>
  </div>
</section>

     <div class="cart-overlay" id="cartOverlay">
    <div class="cart-backdrop" id="cartBackdrop"></div>
    <div class="cart-sidebar">
      <div class="cart-header">
        <h2>YOUR CART (<span id="cartCount">0</span>)</h2>
        <button class="close-btn" id="cartCloseBtn">&times;</button>
      </div>
      <div class="cart-body" id="cartBody">
        <p>Your cart is empty.</p>
        <p>Add some items to get started.</p>
      </div>
      <div class="cart-footer">
        <div class="subtotal">
          <span>Subtotal</span>
          <span id="cartSubtotal">$0.00</span>
        </div>
        <button id="checkout" class="checkout-btn">PROCEED TO CHECKOUT</button>
          <button class="continue-btn" id="cartContinueBtn" onclick="back_to_shop()" >Continue Shopping</button>
      </div>
    </div>
  </div>


<div class="search-overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Site search">
  <div class="overlay-backdrop" id="backdrop"></div>
  <div class="overlay-content">

    <div class="overlay-top">
      <span class="overlay-brand">KHR</span>
      <button class="close-btn" id="closeSearch" aria-label="Close search">
        <i class="fa fa-times"></i>
      </button>
    </div>

    <div class="search-field-wrap">
      <input
        class="search-field"
        id="searchInput"
        type="text"
        placeholder="Search for anything…"
        autocomplete="off"
        aria-label="Search products"
      />
      <i class="fa fa-search field-icon"></i>
    </div>
  </div>
</div> 


    <div class="our-products" id="our-products">
<p class="section-label">Curated for you</p>
      Our Products
    </div>
    <div class="left-right" id="Collection-page">
<section class="products">
    <div class="product-grid" id="productGrid"></div>
</section>
    </div>
    <footer class="footer">
      <h1>KHR</h1>
      <div class="footer-links">
        <a href="#Collection-page">COLLECTIONS </a>
        <a href="#" onclick="openCart(event)">CART</a>
        <a href="./about-page/index.html">ABOUT</a>
      </div>
      <p class="credit">
        Made by <a href="https://github.com/khr7585">Hemanth Reddy</a>
      </p>
    </footer>
    <script src="./index.js"></script>
  <script src="./cart-page/index.js"></script>
  </body>
</html>
