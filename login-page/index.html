<html>
  <head>
    <title>Sign In</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Montserrat:wght@300;400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="page">
      <div class="page-bg loaded" id="pageBg"></div>
      <div class="page-overlay"></div>
      <div class="page-overlay-bottom"></div>

      <div class="brand">JAKE BILLA</div>

      <div class="right">
        <button class="back-btn" onclick="history.back()">
          <svg
            class="back-arrow"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
          Back
        </button>
        <div class="form-wrap">
          <p class="form-tag">Welcome back</p>
          <h2 class="form-title">Sign in</h2>
          <p class="form-sub">Access your collection &amp; orders</p>

          <div class="field">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>

          <a class="forgot" href="#">Forgot password?</a>

          <button class="btn-login" >Sign in</button>

          <div class="signup-row">
            <span>New to Jake Billa? </span>
            <a href="../register-page/index.html">Create account</a>
          </div>
        </div>
      </div>
    </div>
    <!-- <script src="../index.js" ></script> -->
  </body>
</html>
